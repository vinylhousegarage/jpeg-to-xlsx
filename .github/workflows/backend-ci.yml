name: Backend CI

on:
  push:
    branches:
      - main
    paths: &ci-paths
      - 'backend/**'
      - 'compose.yaml'
      - '.github/workflows/backend-ci.yml'

  pull_request:
    branches:
      - main
    paths: *ci-paths

permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.3'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout 5m
          working-directory: ./backend
          install-mode: binary

      - name: Run tests
        run: go test ./...

  validate-compose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config --quiet --no-interpolate
