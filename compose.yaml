services:
  infra:
    build:
      context: ./infra
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /workspace/infra

    volumes:
      - ./:/workspace
      - ~/.aws:/home/node/.aws

    environment:
      - APP_ENV=${APP_ENV}
      - APPLICATION_URL=${APPLICATION_URL}
      - AWS_PROFILE=${AWS_PROFILE}
      - AWS_REGION=${AWS_REGION}
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - PROMPT_FILE_NAME=${PROMPT_FILE_NAME}
      - SLACK_CLIENT_ID=${SLACK_CLIENT_ID}
      - SLACK_REDIRECT_URI=${SLACK_REDIRECT_URI}

    command: sleep infinity
    tty: true
    stdin_open: true
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      target: ${DOCKER_TARGET:-dev}
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /workspace/backend

    volumes:
      - ./:/workspace
      - ~/.aws:/home/appuser/.aws
      - ~/.aws/sso/cache:/home/appuser/.aws/sso/cache
      - backend_pkg:/go/pkg
      - backend_bin:/go/bin

    ports:
      - "8080:8080"

    environment:
      - AWS_PROFILE=${AWS_PROFILE}
      - AWS_REGION=${AWS_REGION}

    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /workspace/frontend

    volumes:
      - ./:/workspace
      - frontend_node_modules:/workspace/frontend/node_modules

    ports:
      - "8081:5173"

    environment:
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}

    networks:
      - app-network

    command: sh -c "npm run dev -- --host 0.0.0.0"

networks:
  app-network:
    driver: bridge

volumes:
  backend_bin:
  backend_pkg:
  frontend_node_modules:
  