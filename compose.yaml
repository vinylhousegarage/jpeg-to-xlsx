services:
  infra:
    build:
      context: ./infra
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    container_name: cdk
    working_dir: /workspace/infra

    volumes:
      - ./:/workspace
      - ~/.aws:/home/node/.aws

    environment:
      - APP_ENV=${APP_ENV}
      - AWS_PROFILE=${AWS_PROFILE}
      - AWS_REGION=${AWS_REGION}
      - AWS_SDK_LOAD_CONFIG=${AWS_SDK_LOAD_CONFIG}
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID}
      - PROMPT_FILE_NAME=${PROMPT_FILE_NAME}
      - SLACK_CLIENT_ID=${SLACK_CLIENT_ID}
      - SLACK_CLIENT_SECRET_ARN=${SLACK_CLIENT_SECRET_ARN}
      - SLACK_REDIRECT_URI=${SLACK_REDIRECT_URI}

    command: sleep infinity
    tty: true
    stdin_open: true
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      target: ${DOCKER_TARGET:-dev}
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    container_name: go
    working_dir: /workspace/backend

    volumes:
      - ./:/workspace
      - ~/.aws:/home/appuser/.aws
      - ~/.aws/sso/cache:/home/appuser/.aws/sso/cache
      - backend_pkg:/go/pkg
      - backend_bin:/go/bin

    ports:
      - "8080:8080"

    environment:
      - APP_ENV=${APP_ENV}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_LAMBDA_FUNCTION_NAME=${AWS_LAMBDA_FUNCTION_NAME}
      - AWS_PROFILE=${AWS_PROFILE}
      - AWS_REGION=${AWS_REGION}
      - AWS_SDK_LOAD_CONFIG=${AWS_SDK_LOAD_CONFIG}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID}
      - INPUT_BUCKET_NAME=${INPUT_BUCKET_NAME}
      - IS_LAMBDA=${IS_LAMBDA}
      - OUTPUT_BUCKET_NAME=${OUTPUT_BUCKET_NAME}
      - PROMPT_FILE_NAME=${PROMPT_FILE_NAME}
      - SLACK_CLIENT_ID=${SLACK_CLIENT_ID}
      - SLACK_CLIENT_SECRET=${SLACK_CLIENT_SECRET:-}
      - SLACK_CLIENT_SECRET_ARN=${SLACK_CLIENT_SECRET_ARN:-}
      - SLACK_REDIRECT_URI=${SLACK_REDIRECT_URI}
      - SLACK_TOKEN_TABLE_NAME=${SLACK_TOKEN_TABLE_NAME}

    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    container_name: typescript
    working_dir: /workspace/frontend

    volumes:
      - ./:/workspace
      - frontend_node_modules:/workspace/frontend/node_modules

    ports:
      - "8081:5173"

    environment:
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}

    networks:
      - app-network

    command: sh -c "npm run dev -- --host 0.0.0.0"

networks:
  app-network:
    name: app-network
    driver: bridge

volumes:
  backend_bin:
  backend_pkg:
  frontend_node_modules:
  